version: "3.8"

services:
    postgres:
        image: postgres:16-alpine
        container_name: test-base
        restart: always
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
            POSTGRES_DB: test2
        ports:
            - "5433:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data
        networks:
            - test-test
    cloudbeaver:
        image: dbeaver/cloudbeaver:latest
        container_name: test-cloudbeaver
        restart: always
        ports:
            - "8978:8978"
        volumes:
            - cloudbeaver_data:/opt/cloudbeaver/workspace
        depends_on:
            - postgres
        networks:
            - test-test

volumes:
    postgres_data:
        name: test-postgres-data
    cloudbeaver_data:
        name: test-cloudbeaver-data

networks:
    test-test:
        name: test-test
