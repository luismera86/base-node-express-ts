version: "3.8"

services:
    postgres:
        image: postgres:16-alpine
        container_name: base-postgres
        restart: always
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
            POSTGRES_DB: mydb
        ports:
            - "5433:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data
        networks:
            - base-network
    cloudbeaver:
        image: dbeaver/cloudbeaver:latest
        container_name: base-cloudbeaver
        restart: always
        ports:
            - "8978:8978"
        volumes:
            - cloudbeaver_data:/opt/cloudbeaver/workspace
        depends_on:
            - postgres
        networks:
            - base-network

volumes:
    postgres_data:
        name: base-postgres-data
    cloudbeaver_data:
        name: base-cloudbeaver-data

networks:
    base-network:
        name: base-network
